worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # ── Upstreams: backend services ────────────────────────────
    upstream auth_service      { server auth-service:8001; }
    upstream booking_service   { server booking-service:8002; }
    upstream calendar_service  { server calendar-service:8003; }
    upstream analytics_service { server analytics-service:8005; }
    upstream notification_ws   { server notification-ws:8006; }
    upstream frontend_app      { server frontend:5173; }
    upstream kafdrop_ui        { server kafdrop:9000; }

    server {
        listen 80;
        server_name _;

        # ── API routing ────────────────────────────────────────
        # The SPA calls the gateway under an /api/* prefix (VITE_API_BASE=/api).
        # We accept BOTH shapes so the frontend and curl/tests agree:
        #   /api/auth/*  AND  /auth/*   -> auth-service
        #   /api/booking/* AND /booking/* -> booking-service
        #   ...etc
        # The /api form strips the prefix via the proxy_pass URI (nginx replaces
        # the matched location prefix with the proxy_pass path), so
        #   /api/auth/register  ->  auth-service:8001/auth/register
        #
        # everything else -> frontend (SPA + Vite assets)

        location /api/auth/ {
            proxy_pass http://auth_service/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/booking/ {
            proxy_pass http://booking_service/booking/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/calendar/ {
            proxy_pass http://calendar_service/calendar/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/analytics/ {
            proxy_pass http://analytics_service/analytics/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # ── Notifications WebSocket (real-time delivery) ───────
        # The SPA opens ws(s)://<gateway>/api/notifications/ws?token=<JWT>.
        # WebSocket needs HTTP/1.1 + the Upgrade/Connection headers; the long
        # read timeout keeps idle connections from being dropped.
        location /api/notifications/ {
            proxy_pass http://notification_ws/notifications/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # ── Direct (no-prefix) routes: curl, tests, service-to-service ──
        location /auth/ {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /booking/ {
            proxy_pass http://booking_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /calendar/ {
            proxy_pass http://calendar_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /analytics/ {
            proxy_pass http://analytics_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /notifications/ {
            proxy_pass http://notification_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # ── Kafdrop (Kafka web UI) ─────────────────────────────
        # Kafdrop runs with contextpath /kafdrop, so the URI is passed
        # through unchanged. Reach it at http://localhost:8080/kafdrop/.
        location /kafdrop/ {
            proxy_pass http://kafdrop_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Frontend (Vite dev server, incl. HMR websocket) ────
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
