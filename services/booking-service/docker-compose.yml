# ──────────────────────────────────────────────────────────────────
# booking-service + its OWN PostgreSQL instance (database-per-service).
#
# booking-service also uses the shared backbone (Redis lock + Kafka
# producer). Those are reached purely by env (REDIS_HOST /
# KAFKA_BOOTSTRAP_SERVERS) and the client code retries until they are
# reachable, so there is no hard compose dependency on the infra file —
# point the env at any host (local container or a remote cluster).
# ──────────────────────────────────────────────────────────────────

networks:
  default:
    name: callbooking
    external: true

services:
  booking-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${BOOKING_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BOOKING_POSTGRES_PASSWORD}
      POSTGRES_DB: ${BOOKING_POSTGRES_DB}
    volumes:
      - booking_pg_data:/var/lib/postgresql/data
    ports:
      - "${BOOKING_POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOOKING_POSTGRES_USER} -d ${BOOKING_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  booking-service:
    build: .
    environment:
      POSTGRES_USER: ${BOOKING_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BOOKING_POSTGRES_PASSWORD}
      POSTGRES_HOST: ${BOOKING_POSTGRES_HOST}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${BOOKING_POSTGRES_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_LOCK_DB: ${REDIS_LOCK_DB}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_BOOKING_CREATED: ${KAFKA_TOPIC_BOOKING_CREATED}
      KAFKA_TOPIC_BOOKING_CANCELLED: ${KAFKA_TOPIC_BOOKING_CANCELLED}
      KAFKA_TOPIC_BOOKING_UPDATED: ${KAFKA_TOPIC_BOOKING_UPDATED}
      # RS256: booking-service verifies tokens with the public key only.
      # Algorithm is fixed to RS256 in app/config.py — not overridable via env.
      JWT_PUBLIC_KEY_PATH: /keys/public.pem
    volumes:
      - ../../infra/jwt/public.pem:/keys/public.pem:ro
    ports:
      - "${BOOKING_PORT}:8002"
    depends_on:
      booking-postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  booking_pg_data:
