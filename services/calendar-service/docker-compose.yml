# ──────────────────────────────────────────────────────────────────
# calendar-service + its OWN PostgreSQL instance (database-per-service).
#
# Consumes booking.* events from Kafka (shared backbone, reached by env;
# the consumer retries until Kafka is reachable) and stores the mapping of
# booking -> external calendar event in its own database.
# ──────────────────────────────────────────────────────────────────

networks:
  default:
    name: callbooking
    external: true

services:
  calendar-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${CALENDAR_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CALENDAR_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CALENDAR_POSTGRES_DB}
    volumes:
      - calendar_pg_data:/var/lib/postgresql/data
    ports:
      - "${CALENDAR_POSTGRES_HOST_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CALENDAR_POSTGRES_USER} -d ${CALENDAR_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  calendar-service:
    build: .
    environment:
      POSTGRES_USER: ${CALENDAR_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CALENDAR_POSTGRES_PASSWORD}
      POSTGRES_HOST: ${CALENDAR_POSTGRES_HOST}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${CALENDAR_POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_BOOKING_CREATED: ${KAFKA_TOPIC_BOOKING_CREATED}
      KAFKA_TOPIC_BOOKING_CANCELLED: ${KAFKA_TOPIC_BOOKING_CANCELLED}
      KAFKA_TOPIC_BOOKING_UPDATED: ${KAFKA_TOPIC_BOOKING_UPDATED}
      # Google OAuth / Calendar
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI}
      GOOGLE_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
      # Resolve participant email/name for calendar events.
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      # RS256: verify tokens issued by auth-service (public key only) so the
      # OAuth endpoints know which user is connecting. Algorithm is fixed to
      # RS256 in app/config.py — not overridable via env.
      JWT_PUBLIC_KEY_PATH: /keys/public.pem
    volumes:
      - ../../infra/jwt/public.pem:/keys/public.pem:ro
    ports:
      - "${CALENDAR_PORT}:8003"
    depends_on:
      calendar-postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  calendar_pg_data:
