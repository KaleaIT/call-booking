# ──────────────────────────────────────────────────────────────────
# notification-service: two processes off the same image.
#   * consumer   — reads booking.* from Kafka, builds per-user notifications,
#                  publishes them to Redis pub/sub and stores a short history.
#   * ws-server  — FastAPI/uvicorn WebSocket server; subscribed to Redis
#                  pub/sub, pushes notifications to connected users in real time.
#
# Stateless: no database of its own. Uses Redis (pub/sub + history) and Kafka
# from the shared backbone, both reached by env and retried by the client.
# Reached by the frontend through the gateway at /api/notifications/* — the
# ws-server port is not published to the host.
# ──────────────────────────────────────────────────────────────────

networks:
  default:
    name: callbooking
    external: true

services:
  notification-service:
    build: .
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_BOOKING_CREATED: ${KAFKA_TOPIC_BOOKING_CREATED}
      KAFKA_TOPIC_BOOKING_CANCELLED: ${KAFKA_TOPIC_BOOKING_CANCELLED}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_NOTIFICATIONS_DB: ${REDIS_NOTIFICATIONS_DB:-1}

  notification-ws:
    build: .
    command: uvicorn app.ws_server:app --host 0.0.0.0 --port 8006
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_NOTIFICATIONS_DB: ${REDIS_NOTIFICATIONS_DB:-1}
      # RS256: notification-service verifies tokens with the public key only.
      # Algorithm is fixed to RS256 in app/config.py — not overridable via env.
      JWT_PUBLIC_KEY_PATH: /keys/public.pem
    volumes:
      - ../../infra/jwt/public.pem:/keys/public.pem:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/notifications/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
